<!DOCTYPE html>
<html lang="en" data-text-justification="justified">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Min Kim — Design Engineer & Writer</title>
  <meta name="description" content="A design engineer's personal blog on craft, Japanese Mincho typography, systems, and human-scale ergonomics.">
  
  <!-- Preconnect Google Fonts for ultra-fast typography loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./src/style.css">

  <!-- Theme initialization script before paint to prevent flash -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem("theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = savedTheme ? savedTheme : (prefersDark ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        
        const savedJustification = localStorage.getItem("textJustification");
        if (savedJustification) {
          document.documentElement.dataset.textJustification = savedJustification;
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="page-container">
    <!-- Left Navigation Dock -->
    <aside class="page-sidebar" id="page-sidebar">
      <div>
        <div class="nav-header-mobile">
          <a href="#blog" class="brand" id="brand-link" aria-label="Min Kim Home">
            <span class="brand-glyph" id="brand-glyph-container"></span>
            <span>minkim</span>
          </a>
        </div>

        <nav aria-label="Main Navigation">
          <ul class="nav-links">
            <li>
              <a href="#blog" class="nav-link active" data-nav="blog">Blog</a>
              <ul class="subnav-posts" id="sidebar-post-subnav" style="display: none; padding-left: 0.75rem; margin-top: 0.25rem;">
                <!-- Dynamically populated with active post title -->
              </ul>
            </li>
            <li><a href="#work" class="nav-link" data-nav="work">Work</a></li>
            <li><a href="#about" class="nav-link" data-nav="about">About</a></li>
          </ul>
        </nav>
      </div>

      <!-- Action dock at bottom of sidebar -->
      <div class="sidebar-actions">
        <div class="actions-row">
          <!-- Text Justification Toggle -->
          <button id="text-justification-toggle" class="icon-btn" type="button" aria-label="Toggle text justification" title="Toggle Justified / Ragged Text">
            <svg viewBox="0 0 256 256" fill="currentColor">
              <path d="M216,48a8,8,0,0,1-8,8H192V208a8,8,0,0,1-16,0V56H152V208a8,8,0,0,1-16,0V168H96a64,64,0,0,1,0-128H208A8,8,0,0,1,216,48ZM96,152h40V56H96a48,48,0,0,0,0,96Z"/>
            </svg>
          </button>

          <!-- Reader Mode Toggle -->
          <button id="reader-mode-toggle" class="icon-btn" type="button" aria-label="Toggle reader mode" title="Reader Mode (Distraction-free)">
            <svg viewBox="0 0 256 256" fill="currentColor">
              <path d="M232,48H168a32,32,0,0,0-32,32V192a8,8,0,0,0,16,0V80a16,16,0,0,1,16-16h64a8,8,0,0,0,8-8A8,8,0,0,0,232,48ZM104,64H40A16,16,0,0,0,24,80V192a8,8,0,0,0,16,0V80a32,32,0,0,1,32-32h32a8,8,0,0,0,0-16Z M224,96H168a8,8,0,0,0,0,16h56a8,8,0,0,0,0-16Zm0,32H168a8,8,0,0,0,0,16h56a8,8,0,0,0,0-16Zm0,32H168a8,8,0,0,0,0,16h56a8,8,0,0,0,0-16Z"/>
            </svg>
          </button>

          <!-- Search Trigger (⌘K) -->
          <button id="search-trigger" class="icon-btn" type="button" aria-label="Search" title="Search articles (⌘K)">
            <svg viewBox="0 0 256 256" fill="currentColor">
              <path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/>
            </svg>
          </button>

          <!-- Light / Dark Theme Toggle -->
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle color theme" title="Toggle theme">
            <!-- Sun icon for light mode -->
            <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <!-- Moon icon for dark mode -->
            <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Center Main Article / Blog Column -->
    <main class="page-main" id="main-content">
      <!-- Injected dynamically by router: Blog List, Article Detail, Work, About -->
    </main>

    <!-- Right Sticky Table of Contents Column -->
    <aside class="page-toc" id="page-toc" style="display: none;">
      <div class="toc-heading">Table of Contents</div>
      <ul class="toc-list" id="toc-list">
        <!-- Injected dynamically when reading article -->
      </ul>
    </aside>
  </div>

  <!-- Command-K Search Dialog Modal -->
  <div class="search-backdrop" id="search-modal" role="dialog" aria-modal="true" aria-label="Search dialog">
    <div class="search-modal">
      <div class="search-input-wrapper">
        <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor">
          <path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/>
        </svg>
        <input type="search" class="search-input" id="search-input" placeholder="Search essays, craft notes, tags... (ESC to close)" autocomplete="off">
      </div>
      <ul class="search-results" id="search-results">
        <!-- Dynamically injected results -->
      </ul>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
